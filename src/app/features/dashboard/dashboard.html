<header class="dashboard-header">
  <app-page-header
    [compact]="true"
    [eyebrow]="copy.eyebrow"
    [heading]="copy.title"
    [description]="copy.subtitle"
  />
  <div class="create-action">
    <a class="button" routerLink="/repairs/new">{{ copy.create }}</a>
    <button
      type="button"
      class="refresh-all"
      (click)="refreshAll()"
      [disabled]="ready().status === 'loading'"
    >
      Übersicht aktualisieren
    </button>
  </div>
</header>
<section class="metrics" [attr.aria-label]="copy.metricsLabel" aria-describedby="metrics-scope">
  @for (metric of metrics; track metric.key) {
    <app-metric-card
      [metric]="metric"
      [state]="metric.key === 'ready' ? ready() : unavailable"
      [showRetry]="metric.key !== 'ready'"
      (retry)="loadReady()"
    >
      @if (metric.key === 'open' || metric.key === 'ready') {
        <a
          metric-actions
          routerLink="/repairs"
          [queryParams]="
            metric.key === 'ready' ? { view: 'open', status: 'ready_for_pickup' } : { view: 'open' }
          "
          >{{ metric.key === 'ready' ? 'Abholliste öffnen' : 'Offene Aufträge öffnen' }}</a
        >
      }
      @if (metric.key === 'ready') {
        <button
          metric-actions
          class="refresh"
          [class.retry]="ready().status === 'error'"
          type="button"
          (click)="loadReady()"
          [disabled]="ready().status === 'loading'"
          [attr.aria-busy]="ready().status === 'loading'"
          [attr.aria-label]="
            ready().status === 'error' ? copy.ready.title + ': ' + copy.retry : copy.refresh
          "
          aria-describedby="ready-title"
        >
          <span aria-hidden="true">↻</span>
          {{
            ready().status === 'loading'
              ? copy.refreshing
              : ready().status === 'error'
                ? copy.retry
                : copy.refreshShort
          }}
        </button>
      }
    </app-metric-card>
  }
</section>
<p id="metrics-scope" class="metrics-context">{{ copy.scope }}</p>
<app-pickup-widget [refreshKey]="refreshKey()" />
<div class="deadline-widgets">
  <app-unavailable-widget
    class="urgent"
    widgetId="urgent-title"
    heading="Überfällige Aufträge"
    description="Eine verlässliche Übersicht über überfällige Aufträge liegt noch nicht vor. Dringende Aufträge können dennoch bestehen. Bitte prüfen Sie die Termine in der Auftragsverwaltung."
  />
  <app-unavailable-widget
    widgetId="deadlines-title"
    heading="Bevorstehende Fristen"
    description="Eine vollständige, nach Dringlichkeit sortierte Terminübersicht ist noch nicht verfügbar. Bitte prüfen Sie die geplanten Abschlüsse in den einzelnen Aufträgen."
  />
</div>
