<header class="dashboard-header">
  <app-page-header
    [compact]="true"
    [eyebrow]="copy.eyebrow"
    [heading]="copy.title"
    [description]="copy.subtitle"
  />
  <div class="create-action">
    <button type="button" disabled aria-describedby="create-unavailable">{{ copy.create }}</button>
    <span id="create-unavailable">{{ copy.preparing }}</span>
  </div>
</header>
<section class="metrics" [attr.aria-label]="copy.metricsLabel" aria-describedby="metrics-scope">
  @for (metric of metrics; track metric.key) {
    <app-metric-card
      [metric]="metric"
      [state]="metric.key === 'ready' ? ready() : unavailable"
      (retry)="loadReady()"
    >
      @if (metric.key === 'ready' && ready().status !== 'error') {
        <button
          metric-actions
          class="refresh"
          type="button"
          (click)="loadReady()"
          [disabled]="ready().status === 'loading'"
          [attr.aria-busy]="ready().status === 'loading'"
          [attr.aria-label]="copy.refresh"
          aria-describedby="ready-title"
        >
          <span aria-hidden="true">↻</span>
          {{ ready().status === 'loading' ? copy.refreshing : copy.refreshShort }}
        </button>
      }
    </app-metric-card>
  }
</section>
<p id="metrics-scope" class="metrics-context">{{ copy.scope }}</p>
<section class="panel urgent" aria-labelledby="urgent-title">
  <header class="section-header">
    <div>
      <h2 id="urgent-title">{{ copy.urgentTitle }}</h2>
      <p>{{ copy.urgentSubtitle }}</p>
    </div>
  </header>
  <div class="unavailable-state">
    <span class="state-icon" aria-hidden="true">◷</span>
    <div>
      <h3>{{ copy.urgentUnavailable }}</h3>
      <p>{{ copy.urgentDescription }}</p>
    </div>
  </div>
</section>
