<a class="skip-link" href="#main-content">{{ copy.shell.skip }}</a>
<div class="shell" [class.public-shell]="!session.workshopAccess()">
  @if (session.workshopAccess()) {
    <aside class="sidebar">
      <a
        class="brand"
        routerLink="/dashboard"
        (click)="menuOpen.set(false)"
        [attr.aria-label]="copy.shell.home"
      >
        <span class="brand-mark" aria-hidden="true">a.</span> Artelier
      </a>
      <button
        class="menu-toggle"
        #menuButton
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-navigation"
      >
        {{ copy.shell.menu }}
      </button>
      <nav
        id="main-navigation"
        [attr.aria-label]="copy.shell.navigation"
        [class.is-open]="menuOpen()"
      >
        <span class="nav-label">{{ copy.shell.workspace }}</span>
        @for (item of navigation; track item.path) {
          <app-navigation-item
            (selected)="selectNavigation()"
            [path]="item.path"
            [label]="item.label"
            [symbol]="item.symbol"
          />
        }
      </nav>
      <p class="sidebar-note">{{ copy.shell.note }}</p>
    </aside>
  }
  <div class="workspace">
    @if (session.workshopAccess()) {
      <app-workspace-header [title]="pageTitle()">
        <app-account-controls account-controls />
      </app-workspace-header>
    }
    <main #mainContent id="main-content" tabindex="-1">
      @if (session.status() === 'loading') {
        <app-loading-indicator [label]="copy.shell.checkingSession" />
      }
      <router-outlet />
    </main>
    <footer>
      Artelier <span>{{ copy.shell.footer }}</span>
    </footer>
  </div>
</div>
